services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat-calendar
    restart: unless-stopped
    environment:
      ACCOUNT: ${QQ_ACCOUNT:?set QQ_ACCOUNT}
      WEBUI_TOKEN: ${WS_TOKEN:?set WS_TOKEN}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:6099:6099"
    volumes:
      - ../data/napcat-config:/app/napcat/config
      - ../data/qq-session:/app/.config/QQ
